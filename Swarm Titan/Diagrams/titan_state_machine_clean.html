
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#00B4C8;--ink:#0D0D0D;--rule:rgba(13,13,13,0.1);--mono:'Space Mono',monospace;--sans:'Inter',sans-serif}
</style>
<div style="background:#fff;padding:32px 28px 28px;font-family:var(--sans)">
  <div style="font-size:20px;font-weight:500;color:var(--ink);letter-spacing:-0.02em;margin-bottom:4px">Mission lifecycle state machine</div>
  <div style="height:0.5px;background:var(--rule);margin:12px 0 0"></div>

  <svg width="100%" viewBox="0 0 680 400" role="img">
    <title>Mission lifecycle state machine</title>
    <desc>Two state machines: agent operational cycle and mission phase sequence.</desc>
    <defs>
      <marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 2L8 5L2 8" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 2L8 5L2 8" fill="none" stroke="rgba(13,13,13,0.25)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <!-- AGENT OP CYCLE label -->
    <text x="40" y="30" font-family="'Space Mono',monospace" font-size="7.5" letter-spacing="0.18em" fill="#888">AGENT OPERATIONAL CYCLE</text>

    <!-- Entry dot -->
    <circle cx="44" cy="66" r="5" fill="#0D0D0D"/>
    <line x1="49" y1="66" x2="66" y2="66" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>

    <!-- FLY -->
    <rect x="68" y="42" width="110" height="48" rx="5" fill="#fff" stroke="#00B4C8" stroke-width="1.2"/>
    <text x="123" y="58" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#00B4C8">op-fly</text>
    <text x="123" y="74" text-anchor="middle" font-family="'Space Mono',monospace" font-size="13" font-weight="700" fill="#0D0D0D">FLY</text>

    <line x1="178" y1="66" x2="220" y2="66" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>
    <text x="199" y="58" text-anchor="middle" font-family="'Space Mono',monospace" font-size="6.5" fill="#888">daily rotation</text>
    <text x="199" y="68" text-anchor="middle" font-family="'Space Mono',monospace" font-size="6.5" fill="#888">battery ≥ 380 Wh</text>

    <!-- GROUND SCIENCE -->
    <rect x="222" y="42" width="148" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <text x="296" y="58" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">op-ground</text>
    <text x="296" y="74" text-anchor="middle" font-family="'Space Mono',monospace" font-size="11" font-weight="700" fill="#0D0D0D">GROUND SCI</text>

    <line x1="370" y1="66" x2="412" y2="66" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>
    <text x="391" y="58" text-anchor="middle" font-family="'Space Mono',monospace" font-size="6.5" fill="#888">sampling done</text>

    <!-- REST -->
    <rect x="414" y="42" width="108" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <text x="468" y="58" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">op-rest</text>
    <text x="468" y="74" text-anchor="middle" font-family="'Space Mono',monospace" font-size="13" font-weight="700" fill="#0D0D0D">REST</text>

    <!-- Return arc -->
    <path d="M468 90 C468 114 123 114 123 92" fill="none" stroke="rgba(13,13,13,0.15)" stroke-width="0.7" stroke-dasharray="4 3" marker-end="url(#arP)"/>
    <text x="295" y="128" text-anchor="middle" font-family="'Space Mono',monospace" font-size="6.5" fill="#888">sortie complete / AOI identified</text>

    <!-- Divider -->
    <line x1="40" y1="148" x2="640" y2="148" stroke="rgba(13,13,13,0.07)" stroke-width="0.5"/>
    <text x="40" y="167" font-family="'Space Mono',monospace" font-size="7.5" letter-spacing="0.18em" fill="#888">MISSION LIFECYCLE</text>

    <!-- Entry -->
    <circle cx="44" cy="210" r="5" fill="#0D0D0D"/>
    <line x1="49" y1="210" x2="62" y2="210" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>

    <!-- LAUNCH -->
    <rect x="64" y="186" width="82" height="48" rx="5" fill="#fff" stroke="#00B4C8" stroke-width="1.2"/>
    <text x="105" y="202" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#00B4C8">st-launch</text>
    <text x="105" y="217" text-anchor="middle" font-family="'Space Mono',monospace" font-size="11" font-weight="700" fill="#0D0D0D">Launch</text>

    <line x1="146" y1="210" x2="162" y2="210" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>

    <!-- CRUISE -->
    <rect x="164" y="186" width="100" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <text x="214" y="202" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">st-journey</text>
    <text x="214" y="217" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10" font-weight="700" fill="#0D0D0D">Cruise / Hibn.</text>

    <line x1="264" y1="210" x2="280" y2="210" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>

    <!-- EDL -->
    <rect x="282" y="186" width="70" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <text x="317" y="202" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">st-edl</text>
    <text x="317" y="217" text-anchor="middle" font-family="'Space Mono',monospace" font-size="11" font-weight="700" fill="#0D0D0D">EDL</text>

    <line x1="352" y1="210" x2="368" y2="210" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>

    <!-- COMMISSIONING -->
    <rect x="370" y="186" width="96" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <text x="418" y="202" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">st-commission</text>
    <text x="418" y="217" text-anchor="middle" font-family="'Space Mono',monospace" font-size="10" font-weight="700" fill="#0D0D0D">Commission.</text>

    <line x1="466" y1="210" x2="482" y2="210" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>

    <!-- SCIENCE -->
    <rect x="484" y="186" width="78" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <text x="523" y="202" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">st-science</text>
    <text x="523" y="217" text-anchor="middle" font-family="'Space Mono',monospace" font-size="11" font-weight="700" fill="#0D0D0D">Science</text>

    <line x1="562" y1="210" x2="578" y2="210" stroke="#444" stroke-width="0.8" marker-end="url(#arP)"/>

    <!-- EOL -->
    <rect x="580" y="186" width="52" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.35)" stroke-width="0.8"/>
    <text x="606" y="202" text-anchor="middle" font-family="'Space Mono',monospace" font-size="6.5" fill="#444">st-eol</text>
    <text x="606" y="217" text-anchor="middle" font-family="'Space Mono',monospace" font-size="9" font-weight="700" fill="#0D0D0D">EOL</text>

    <!-- SAFE MODE -->
    <rect x="250" y="302" width="132" height="48" rx="5" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.5" stroke-dasharray="4 2"/>
    <text x="316" y="318" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">st-safe</text>
    <text x="316" y="334" text-anchor="middle" font-family="'Space Mono',monospace" font-size="11" font-weight="700" fill="#0D0D0D">Safe mode</text>

    <!-- Anomaly paths -->
    <path d="M214 234 C214 262 278 270 288 302" fill="none" stroke="rgba(13,13,13,0.15)" stroke-width="0.7" stroke-dasharray="3 3" marker-end="url(#arG)"/>
    <path d="M317 234 L317 300" fill="none" stroke="rgba(13,13,13,0.15)" stroke-width="0.7" stroke-dasharray="3 3" marker-end="url(#arG)"/>
    <path d="M418 234 C418 262 356 270 344 302" fill="none" stroke="rgba(13,13,13,0.15)" stroke-width="0.7" stroke-dasharray="3 3" marker-end="url(#arG)"/>
    <text x="196" y="290" font-family="'Space Mono',monospace" font-size="6.5" fill="#aaa">anomaly</text>

    <!-- Recovery -->
    <path d="M316 350 C316 374 418 374 418 236" fill="none" stroke="rgba(13,13,13,0.12)" stroke-width="0.7" stroke-dasharray="3 3" marker-end="url(#arG)"/>
    <text x="394" y="376" font-family="'Space Mono',monospace" font-size="6.5" fill="#aaa">recovery cmd</text>
  </svg>

  <div style="height:0.5px;background:var(--rule);margin:6px 0 12px"></div>
  <div style="display:flex;gap:18px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:12px;height:12px;border:1.2px solid #00B4C8;border-radius:2px;display:inline-block"></span>entry / active</span>
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:12px;height:12px;border:0.5px solid rgba(13,13,13,0.18);border-radius:2px;display:inline-block"></span>nominal state</span>
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:12px;height:12px;border:0.5px dashed rgba(13,13,13,0.3);border-radius:2px;display:inline-block"></span>safe mode</span>
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:12px;height:12px;border:0.8px solid rgba(13,13,13,0.35);border-radius:2px;display:inline-block"></span>end-of-life</span>
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:18px;height:1px;border-top:1px dashed rgba(13,13,13,0.25);display:inline-block"></span>anomaly / recovery</span>
  </div>
</div>
