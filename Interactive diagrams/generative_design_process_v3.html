
<style>
*{box-sizing:border-box;margin:0;padding:0}
#wrap{width:100%;height:560px;position:relative;overflow:hidden;background:#ffffff;border:0.5px solid #e2e8f0;border-radius:6px;font-family:'IBM Plex Mono',monospace}
canvas{position:absolute;inset:0;pointer-events:none;z-index:1}
#nl{position:absolute;inset:0;z-index:2}
.nd{position:absolute;width:90px;background:#ffffff;border-radius:4px;cursor:grab;user-select:none;display:flex;align-items:stretch;box-shadow:0 1px 5px rgba(0,0,0,0.08)}
.nd.gen, .nd.ml, .nd.sim {width:110px}
.nd:active{cursor:grabbing}
.nds{width:4px;border-radius:4px 0 0 4px;flex-shrink:0}
.ndb{padding:5px 8px 5px 6px;flex:1}
.ndt{font-size:8px;color:rgba(0,0,0,0.72);font-weight:600;line-height:1.25}
.nds2{font-size:6.8px;color:rgba(0,0,0,0.3);margin-top:2px;line-height:1.2}
.pin{position:absolute;width:8px;height:8px;border-radius:50%;top:50%;transform:translateY(-50%);z-index:3}
.po{right:-4px}.pi{left:-4px}
#leg{position:absolute;bottom:8px;left:10px;display:flex;gap:12px;font-size:7px;color:rgba(0,0,0,0.3);letter-spacing:.05em;z-index:10;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:4px}
.ld{width:7px;height:7px;border-radius:50%}
#hint{position:absolute;top:8px;right:10px;font-size:7px;color:rgba(0,0,0,0.2);letter-spacing:.06em;z-index:10}
#tt{position:absolute;background:rgba(15,23,42,0.93);color:#fff;font-size:8px;padding:7px 10px;border-radius:3px;pointer-events:none;display:none;max-width:190px;line-height:1.55;z-index:20;letter-spacing:.02em}
#tt strong{display:block;margin-bottom:3px;font-size:9px;color:#5dcaa5}
</style>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="nl"></div>
  <div id="leg">
    <div class="li"><div class="ld" style="background:#334155"></div>INPUT</div>
    <div class="li"><div class="ld" style="background:#0369a1"></div>GENERATIVE</div>
    <div class="li"><div class="ld" style="background:#7c3aed"></div>AI / ML</div>
    <div class="li"><div class="ld" style="background:#059669"></div>SIMULATION</div>
    <div class="li"><div class="ld" style="background:#d97706"></div>DESIGN SPACE</div>
    <div class="li"><div class="ld" style="background:#dc2626"></div>OUTPUT</div>
  </div>
  <div id="hint">DRAG NODES · HOVER FOR DETAIL</div>
  <div id="tt"></div>
</div>
<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#94a3b8;margin-top:5px">GENERATIVE DESIGN PROCESS & FRAMEWORKS · INTERACTIVE NODE GRAPH</div>
<script>
const COLS={input:'#334155',gen:'#0369a1',ml:'#7c3aed',sim:'#059669',dspace:'#d97706',output:'#dc2626'};

// Columns: 4%, 25%, 48%, 72%, 92% — all fit within 100% width
const DEFS=[
  {id:'data', px:.02,py:.08,cat:'input', title:'Data Sources',   sub:'site · sensor · user · meteo',  desc:'Site conditions, sensor streams, user preferences and meteorological data — raw parameter inputs.',out:true,in:false},
  {id:'con',  px:.02,py:.36,cat:'input', title:'Constraints',    sub:'budget · materials · regs',      desc:'Budget, material specs, structural regulations — boundary conditions constraining the design space.',out:true,in:false},
  {id:'gol',  px:.02,py:.63,cat:'input', title:'Goals',          sub:'efficiency · form · perf',       desc:'Optimise efficiency, reduce waste, aesthetic form, enhance performance — the fitness function.',out:true,in:false},

  {id:'par',  px:.27,py:.04,cat:'gen',   title:'Parametric Modelling',  sub:'Grasshopper · Dynamo',   desc:'GH and Dynamo define parametric geometry through controlled parameter ranges and mathematical relationships.',out:true,in:true},
  {id:'alg',  px:.27,py:.29,cat:'gen',   title:'Algorithmic Form Gen',  sub:'Cellular · Fractal · Branch',desc:'Cellular automata, fractal growth and branching systems generate complex morphologies from simple rules.',out:true,in:true},
  {id:'ai',   px:.27,py:.52,cat:'ml',    title:'AI & Machine Learning', sub:'GANs · Reinforcement RL', desc:'GANs produce novel variants; Reinforcement Learning agents optimise decisions through reward-based iteration.',out:true,in:true},
  {id:'sim',  px:.27,py:.75,cat:'sim',   title:'Simulation & Analysis', sub:'FEA · CFD · Energy',      desc:'FEA, CFD and energy simulation validate structural integrity and environmental performance.',out:true,in:true},

  {id:'dse',  px:.54,py:.36,cat:'dspace',title:'Design Space Exploration',sub:'lighting · cost · energy',desc:'Multi-objective Pareto optimisation across lighting, cost, structural efficiency and energy use.',out:true,in:true},

  {id:'fab',  px:.81,py:.07,cat:'output',title:'Digital Fabrication',   sub:'3D print · CNC · robotic', desc:'Fabrication-ready output: 3D printing, CNC milling and robotic assembly with tolerance-aware files.',out:false,in:true},
  {id:'viz',  px:.81,py:.36,cat:'output',title:'Visualisation & Proto',  sub:'render · VR · physical',  desc:'Photorealistic renders, VR walkthroughs and physical prototypes for client validation.',out:false,in:true},
  {id:'opt',  px:.81,py:.65,cat:'output',title:'Optimised Solution',     sub:'selected · validated',    desc:'Final validated design — selected from the Pareto front as optimal balance of all competing objectives.',out:false,in:true},
];

const EDGES=[
  ['data','par'],['data','alg'],['data','ai'],
  ['con','alg'],['con','ai'],['con','sim'],
  ['gol','par'],['gol','ai'],['gol','sim'],
  ['par','dse'],['alg','dse'],['ai','dse'],['sim','dse'],
  ['dse','fab'],['dse','viz'],['dse','opt'],
  ['par','fab'],['sim','opt'],
];

const wrap=document.getElementById('wrap');
const cv=document.getElementById('cv');
const nl=document.getElementById('nl');
const tt=document.getElementById('tt');
let W,H;
const pos={},els={},pulses=[];
let af=0;

function build(){
  W=wrap.offsetWidth; H=wrap.offsetHeight;
  cv.width=W; cv.height=H;
  nl.innerHTML='';
  Object.keys(els).forEach(k=>delete els[k]);

  DEFS.forEach(n=>{
    pos[n.id]={x:n.px*W, y:n.py*H};
    const col=COLS[n.cat];
    const el=document.createElement('div');
    el.className='nd ' + n.cat;
    el.style.cssText+=`;border-top:1px solid ${col}44;border-right:1px solid ${col}44;border-bottom:1px solid ${col}44;left:${pos[n.id].x}px;top:${pos[n.id].y}px`;
    el.innerHTML=`<div class="nds" style="background:${col}"></div><div class="ndb"><div class="ndt">${n.title}</div><div class="nds2">${n.sub}</div></div>${n.out?`<div class="pin po" style="background:${col};border:2px solid #fff;box-shadow:0 0 0 1.5px ${col}"></div>`:''}${n.in?`<div class="pin pi" style="background:${col};border:2px solid #fff;box-shadow:0 0 0 1.5px ${col}"></div>`:''}`;
    nl.appendChild(el);
    els[n.id]=el;

    let drag=false,ox=0,oy=0;
    el.addEventListener('mousedown',e=>{drag=true;ox=e.clientX-pos[n.id].x;oy=e.clientY-pos[n.id].y;el.style.zIndex=50;e.preventDefault();});
    document.addEventListener('mousemove',e=>{if(!drag)return;pos[n.id].x=e.clientX-ox;pos[n.id].y=e.clientY-oy;el.style.left=pos[n.id].x+'px';el.style.top=pos[n.id].y+'px';});
    document.addEventListener('mouseup',()=>{if(drag){drag=false;el.style.zIndex='';}});
    el.addEventListener('touchstart',e=>{drag=true;ox=e.touches[0].clientX-pos[n.id].x;oy=e.touches[0].clientY-pos[n.id].y;e.preventDefault();},{passive:false});
    document.addEventListener('touchmove',e=>{if(!drag)return;pos[n.id].x=e.touches[0].clientX-ox;pos[n.id].y=e.touches[0].clientY-oy;el.style.left=pos[n.id].x+'px';el.style.top=pos[n.id].y+'px';});
    document.addEventListener('touchend',()=>drag=false);
    el.addEventListener('mouseenter',()=>{tt.innerHTML=`<strong>${n.title}</strong>${n.desc}`;tt.style.display='block';});
    el.addEventListener('mousemove',e=>{const r=wrap.getBoundingClientRect();let tx=e.clientX-r.left+14,ty=e.clientY-r.top-10;if(tx+200>W)tx=e.clientX-r.left-210;if(ty+70>H)ty=H-80;tt.style.left=tx+'px';tt.style.top=ty+'px';});
    el.addEventListener('mouseleave',()=>tt.style.display='none');
  });
}

function pp(id,side){
  const el=els[id];if(!el)return{x:0,y:0};
  return{x:side==='out'?pos[id].x+el.offsetWidth:pos[id].x, y:pos[id].y+el.offsetHeight/2};
}

function draw(){
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,W,H);
  af++;
  if(af%28===0){const e=EDGES[Math.floor(Math.random()*EDGES.length)];pulses.push({f:e[0],t:e[1],p:0});}

  EDGES.forEach(([f,t])=>{
    const a=pp(f,'out'),b=pp(t,'in'),mx=(a.x+b.x)/2;
    const col=COLS[DEFS.find(n=>n.id===f)?.cat]||'#999';
    ctx.strokeStyle=col+'25';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(mx,a.y,mx,b.y,b.x,b.y);ctx.stroke();
  });

  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i];p.p+=.022;
    if(p.p>1){pulses.splice(i,1);continue;}
    const a=pp(p.f,'out'),b=pp(p.t,'in'),mx=(a.x+b.x)/2,t=p.p;
    const px=Math.pow(1-t,3)*a.x+3*Math.pow(1-t,2)*t*mx+3*(1-t)*t*t*mx+t*t*t*b.x;
    const py=Math.pow(1-t,3)*a.y+3*Math.pow(1-t,2)*t*a.y+3*(1-t)*t*t*b.y+t*t*t*b.y;
    const col=COLS[DEFS.find(n=>n.id===p.f)?.cat]||'#999';
    ctx.fillStyle=col+'bb';ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
  }
  requestAnimationFrame(draw);
}

window.addEventListener('resize',build);
build();draw();
</script>
