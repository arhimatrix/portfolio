
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;}
:root{--teal:#00B4C8;--ink:#0D0D0D;--rule:rgba(13,13,13,0.1);--mono:'Space Mono',monospace;--sans:'Inter',sans-serif}
</style>
<div style="background:#fff;padding:32px 28px 28px;font-family:var(--sans)">
  <div style="font-size:8px;font-weight:700;color:#0E7A8A;letter-spacing:0.22em;text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:4px">Adaptive task planning</div>
  <div style="height:0.5px;background:var(--rule);margin:12px 0 0"></div>

  <svg width="100%" height="100%" viewBox="0 0 680 360" preserveAspectRatio="xMidYMid meet" style="width: 100%; height: 100%;" role="img">
    <title>Adaptive task planning parametric logic</title>
    <desc>Node-wire diagram of swarm task planning: input nodes wired through elect_leader and allocate_task to execute.</desc>
    <defs>
      <!-- pattern removed -->
    </defs>
    <!-- grid removed -->

    <!-- Ghost number -->
    <text x="560" y="240" text-anchor="middle" font-family="'Inter',sans-serif" font-size="200" font-weight="600" fill="rgba(13,13,13,0.025)" dominant-baseline="central">02</text>

    <!-- Wires -->
    <path vector-effect="non-scaling-stroke" d="M142 62 C192 62 196 112 238 112" fill="none" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <path vector-effect="non-scaling-stroke" d="M142 124 C192 124 196 122 238 122" fill="none" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <path vector-effect="non-scaling-stroke" d="M142 186 C192 186 196 132 238 132" fill="none" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <path vector-effect="non-scaling-stroke" d="M336 117 C364 117 368 156 392 156" fill="none" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>

    <path vector-effect="non-scaling-stroke" d="M554 292 C586 292 588 326 602 326" fill="none" stroke="rgba(13,13,13,0.18)" stroke-width="0.5"/>
    <path vector-effect="non-scaling-stroke" d="M498 160 C574 160 588 300 602 326" fill="none" stroke="rgba(13,13,13,0.09)" stroke-width="0.4"/>

    <!-- INPUT NODES -->
    <rect vector-effect="non-scaling-stroke" x="50" y="42" width="92" height="34" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4"/>
    <text x="96" y="63" text-anchor="middle" font-family="'Space Mono',monospace" font-size="9" fill="#0D0D0D">agents[ ]</text>

    <rect vector-effect="non-scaling-stroke" x="50" y="106" width="92" height="34" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4"/>
    <text x="96" y="127" text-anchor="middle" font-family="'Space Mono',monospace" font-size="9" fill="#0D0D0D">sensors[ ]</text>

    <rect vector-effect="non-scaling-stroke" x="50" y="170" width="92" height="34" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4"/>
    <text x="96" y="191" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" fill="#0D0D0D">signal_quality</text>

    <rect vector-effect="non-scaling-stroke" x="50" y="234" width="92" height="34" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4"/>
    <text x="96" y="255" text-anchor="middle" font-family="'Space Mono',monospace" font-size="9" fill="#0D0D0D">state[ ]</text>

    <rect vector-effect="non-scaling-stroke" x="50" y="264" width="92" height="34" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4"/>
    <text x="96" y="285" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" fill="#0D0D0D">human_cmd</text>

    <text x="287" y="112" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#00B4C8">fn</text>
    <text x="287" y="128" text-anchor="middle" font-family="'Space Mono',monospace" font-size="9" font-weight="700" fill="#0D0D0D">elect_leader</text>
    <text x="287" y="139" text-anchor="middle" font-family="'Space Mono',monospace" font-size="6.5" fill="#888">consensus</text>
    <text x="287" y="162" text-anchor="middle" font-family="'Space Mono',monospace" font-size="6.5" fill="rgba(0,180,200,0.45)" font-style="italic">the parametric core</text>
    <line vector-effect="non-scaling-stroke" x1="287" y1="145" x2="287" y2="158" stroke="rgba(0,180,200,0.25)" stroke-width="0.4"/>

    <!-- allocate_task -->
    <rect vector-effect="non-scaling-stroke" x="392" y="142" width="106" height="42" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4"/>
    <text x="445" y="158" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">fn</text>
    <text x="445" y="172" text-anchor="middle" font-family="'Space Mono',monospace" font-size="9" font-weight="700" fill="#0D0D0D">allocate_task</text>

    <!-- human_override -->
    <rect vector-effect="non-scaling-stroke" x="388" y="220" width="86" height="34" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4" stroke-dasharray="3 2"/>
    <text x="431" y="235" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">check</text>
    <text x="431" y="247" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" font-weight="700" fill="#444">human_override</text>

    <!-- apply_human_command -->
    <rect vector-effect="non-scaling-stroke" x="436" y="274" width="118" height="34" rx="4" fill="#fff" stroke="rgba(13,13,13,0.18)" stroke-width="0.4"/>
    <text x="495" y="289" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#888">fn</text>
    <text x="495" y="301" text-anchor="middle" font-family="'Space Mono',monospace" font-size="8" font-weight="700" fill="#0D0D0D">apply_human_cmd</text>

    <!-- execute — teal = output -->
    <rect vector-effect="non-scaling-stroke" x="602" y="308" width="66" height="34" rx="4" fill="#fff" stroke="#00B4C8" stroke-width="0.75"/>
    <text x="635" y="323" text-anchor="middle" font-family="'Space Mono',monospace" font-size="7" fill="#00B4C8">out</text>
    <text x="635" y="335" text-anchor="middle" font-family="'Space Mono',monospace" font-size="9" font-weight="700" fill="#0D0D0D">execute</text>

  <div style="height:0.5px;background:var(--rule);margin:6px 0 12px"></div>
  <div style="display:flex;gap:18px;flex-wrap:wrap">
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:12px;height:12px;border:0.75px solid #00B4C8;border-radius:2px;display:inline-block"></span>core fn / output</span>
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:12px;height:12px;border:0.5px solid rgba(13,13,13,0.18);border-radius:2px;display:inline-block"></span>processing node</span>
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:12px;height:12px;border:0.5px dashed rgba(13,13,13,0.25);border-radius:2px;display:inline-block"></span>conditional check</span>
    <span style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;color:#444"><span style="width:18px;height:1px;border-top:0.5px solid rgba(13,13,13,0.18);display:inline-block"></span>data wire</span>
  </div>
</div>
